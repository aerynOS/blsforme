[workspace]
resolver = "2"
members = [
    "blsctl",
    "blsforme",
    "crates/*",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
blake3 = { version = "1.8.4", features = ["mmap", "rayon"] }
log = "0.4.26"
fs-err = "3.1.1"
gpt = "4.1.0"
itertools = "0.15.0"
thiserror = "2.0.11"
nix = { version = "0.31.2", features = ["fs", "mount"] }
os-info = { git = "https://github.com/AerynOS/os-info", rev = "26b39c1d49c3b4f30d778729fb56958824c069de" }
superblock = { git = "https://github.com/AerynOS/disks-rs", rev = "d08bc11dcfb2ad4d031e2adccb97139f9d42c2b8" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snafu = "0.9.0"
uuid = { version = "1.23.0", features = ["v8"] }
zstd = "0.13.3"
